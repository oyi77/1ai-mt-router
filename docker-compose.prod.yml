version: '3.8'

services:
  backend:
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://mt5router:${DB_PASSWORD:?DB_PASSWORD is required in production}@postgres:5432/mt5router
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required in production}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required in production}
      - ROLE=worker
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: mt5-router-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mt5router
      - POSTGRES_USER=mt5router
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required in production}
    networks:
      - mt5-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: mt5-router-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - mt5-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
