server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Handle SPA routing. Security headers live here only, not on /api/:
    # the backend serves /api/v1/vnc/{id}/proxy/vnc.html, which VNCViewer
    # loads in a same-origin iframe, so /api/ responses must stay header-free.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'none'" always;
    }

    # WebSocket-only routes: require an Upgrade header and tolerate long-lived
    # connections (monitoring stream, VNC websockify, trading tick feed).
    location ~ "^/api/v1/(monitoring/stream|vnc/[^/]+/proxy/websockify|trading/ticks)$" {
        if ($http_upgrade = "") {
            return 426;
        }
        proxy_pass http://mt5-router-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # Proxy API requests to backend (REST + everything not matched above).
    # Connection is only forwarded for real upgrade requests, so regular
    # requests keep HTTP keepalive working.
    location /api/ {
        proxy_pass http://mt5-router-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
